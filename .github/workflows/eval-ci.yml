name: AI Eval Pipeline

on:
  workflow_dispatch:

jobs:
  eval:   #任务名
    name: 运行评测并检查回归    # 页面上显示这个
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
         python-version: "3.10"
         cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run evaluation task
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PYTHONPATH: ${{ github.workspace }}
        run: python tasks/run_eval_task.py

      - name: Run judge task
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PYTHONPATH: ${{ github.workspace }}
        run: python tasks/run_judge_task.py

      - name: Generate report
        run: python tasks/generate_report.py

      - name: Check regression
        run: python tasks/check_regression.py

      - name: Upload eval artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: |
            reports/eval_report_*.md
            reports/eval_judged_*.json
            reports/eval_raw_*.json  



